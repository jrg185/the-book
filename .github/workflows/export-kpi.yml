name: Export KPI

# Refreshes public.kpi_sleeve_snapshots, then reads the scrubbed views.
# Robinhood has no fill webhook. Standing sync is hourly.
# Cron 0 * * * * polls only when RH_API_KEY and RH_BASE64_PRIVATE_KEY are
# both set. Hourly Actions poll skipped otherwise, exit 0. No Robinhood call.
# That poll reads RH_AGENTIC_ACCOUNT and fails if the secret is unset.
# Tonight Crypto Desk upserts fills with scripts/upsert_fills_direct.py, then
# workflow_dispatch with no payload. Workflow inputs are public Actions logs.
# Bonus: repository_dispatch rh-fill writes a temp file and upserts kpi_trades.
# The */15 cron only refreshes marks. A bad requested payload exits non-zero
# and stamps data/meta.json. A failed refresh does the same.
# Pull requests only self-test. ROBINHOOD_TOKEN is not used.
# Sleeve is crypto or equities from asset class. USDC and funding are skipped.
# Marks: public Coinbase ticker (crypto) and Yahoo chart (equities).
# FINNHUB_API_KEY, COINSTATS_API_KEY, and ALPHA_VANTAGE_API_KEY are optional.
# data/** pushes are ignored so the export commit does not run this job again.

on:
  schedule:
    # Preferred Actions poll at minute 0. Skips when Robinhood secrets are absent.
    - cron: "0 * * * *"
    # Mark refresh only. These crons do not call Robinhood.
    # US cash session in both EDT and EST (about 9:30am–5:00pm ET), every 15 minutes.
    - cron: "*/15 13-21 * * 1-5"
    # Hourly outside that window, including weekends, so the crypto sleeve does not sit overnight.
    - cron: "7 0-12,22-23 * * 1-5"
    - cron: "7 * * * 0,6"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [rh-fill]

permissions:
  contents: write

concurrency:
  group: export-kpi-main
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Position math
        run: python3 scripts/refresh_kpi_snapshots.py --self-test

      - name: RH fill mapper
        env:
          RH_AGENTIC_ACCOUNT: ${{ secrets.RH_AGENTIC_ACCOUNT }}
        run: python3 scripts/sync_rh_kpi_trades.py --self-test

      - name: Fills stay off the public log
        run: python3 -m unittest scripts/test_fills_private.py

      - name: Realized FIFO and recon
        run: |
          python3 -m pip install --disable-pip-version-check --break-system-packages pytest
          python3 -m pytest scripts/test_kpi_realized.py -q

      - name: Book seeds
        run: |
          python3 scripts/sync_book_seeds.py --self-test
          python3 -m unittest scripts/test_book_seeds.py
          node --test scripts/test_book_seeds.mjs

      - name: Export scrub
        run: |
          python3 scripts/export_kpi.py --self-test
          python3 -m unittest scripts/test_export_status.py
          node --test scripts/test_tape_ux.mjs scripts/test_board_t17.mjs scripts/test_model_scorecard.mjs scripts/test_live_book.mjs scripts/test_book_seeds.mjs

      - name: Runs export scrub
        run: |
          python3 -m unittest scripts/test_runs_export.py
          node --test scripts/test_runs_page.mjs

  export:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hourly Robinhood poll
        if: github.event_name == 'schedule' && github.event.schedule == '0 * * * *'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RH_API_KEY: ${{ secrets.RH_API_KEY }}
          RH_BASE64_PRIVATE_KEY: ${{ secrets.RH_BASE64_PRIVATE_KEY }}
          RH_AGENTIC_ACCOUNT: ${{ secrets.RH_AGENTIC_ACCOUNT }}
        run: |
          if [ -z "${RH_API_KEY}" ] || [ -z "${RH_BASE64_PRIVATE_KEY}" ]; then
            # Without these secrets fills only arrive by scripts/upsert_fills_direct.py. Say so loudly.
            echo "::warning title=Robinhood fills not polled::RH_API_KEY and RH_BASE64_PRIVATE_KEY are unset. kpi_trades only gets fills from scripts/upsert_fills_direct.py. No Robinhood call."
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check --break-system-packages 'pynacl>=1.5,<2'
          python3 scripts/sync_rh_kpi_trades.py --from-rh

      - name: Stage on-fill JSON
        id: stage
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          dest = Path("/tmp/rh-fill.json")
          name = os.environ.get("GITHUB_EVENT_NAME") or ""
          output = os.environ.get("GITHUB_OUTPUT")

          def publish(path: str) -> None:
              if output:
                  with open(output, "a", encoding="utf-8") as handle:
                      handle.write(f"feed={path}\n")
              print("staged fills feed")

          if name == "workflow_dispatch":
              event_path = os.environ.get("GITHUB_EVENT_PATH") or ""
              event = {}
              if event_path and Path(event_path).is_file():
                  try:
                      event = json.loads(Path(event_path).read_text(encoding="utf-8"))
                  except (OSError, json.JSONDecodeError):
                      sys.exit("workflow event could not be read. Fills were not accepted.")
              inputs = event.get("inputs") if isinstance(event, dict) else None
              if isinstance(inputs, dict) and any(str(value or "").strip() for value in inputs.values()):
                  sys.exit(
                      "This workflow does not accept a fills payload. "
                      "Run scripts/upsert_fills_direct.py, then dispatch Export KPI with no inputs."
                  )

          if name == "repository_dispatch":
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              client = event.get("client_payload")
              if not isinstance(client, dict) or not client:
                  sys.exit("rh-fill dispatch needs a client_payload object. kpi_trades was not changed.")
              dest.write_text(json.dumps(client), encoding="utf-8")
              publish(str(dest))
          elif os.environ.get("RH_FILLS_PATH"):
              publish(os.environ["RH_FILLS_PATH"])
          elif Path("data/rh_fills.json").is_file():
              publish("data/rh_fills.json")
          else:
              print("No fill payload. Scheduled Export KPI does not poll Robinhood.")
              if output:
                  with open(output, "a", encoding="utf-8") as handle:
                      handle.write("feed=\n")
          PY

      - name: Sync RH fills into kpi_trades
        if: steps.stage.outputs.feed != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RH_AGENTIC_ACCOUNT: ${{ secrets.RH_AGENTIC_ACCOUNT }}
        run: |
          python3 scripts/sync_rh_kpi_trades.py --self-test
          python3 scripts/sync_rh_kpi_trades.py --from-json "${{ steps.stage.outputs.feed }}"

      - name: Refresh kpi_sleeve_snapshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          COINSTATS_API_KEY: ${{ secrets.COINSTATS_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          RH_API_KEY: ${{ secrets.RH_API_KEY }}
          RH_BASE64_PRIVATE_KEY: ${{ secrets.RH_BASE64_PRIVATE_KEY }}
          RH_AGENTIC_ACCOUNT: ${{ secrets.RH_AGENTIC_ACCOUNT }}
          KPI_MARKS_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/refresh_kpi_snapshots.py

      # Apply order: migration, then this seed sync, then the export reads the view.
      - name: Sync book seeds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 scripts/sync_book_seeds.py

      - name: Export scrubbed Supabase views
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RH_API_KEY: ${{ secrets.RH_API_KEY }}
          RH_BASE64_PRIVATE_KEY: ${{ secrets.RH_BASE64_PRIVATE_KEY }}
          RH_AGENTIC_ACCOUNT: ${{ secrets.RH_AGENTIC_ACCOUNT }}
          KPI_REFRESH_EXPECTED: "1"
          KPI_MARKS_RUN_ID: ${{ github.run_id }}
        # Cash is the stamp refresh wrote into /tmp/the-book-kpi-marks.json.
        # A missing or stale stamp fails this step instead of reading again.
        run: python3 scripts/export_kpi.py

      - name: Commit refreshed JSON
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # book_usd is the sum of holding values. The signal book stays on signal_book_usd.
          # This commit publishes that file. It does not copy the signal book onto book_usd.
          # When holdings and positions are present, running_balance_usd is that cash plus open lots
          # and running_pnl_usd is that total minus the combined seed. Those two are not the warehouse row.
          # sleeve_as_of is that snapshot as_of. generated_at stays the signal file time and is not the MTM clock.
          # Day P&L is day_realized_usd from data/rh_cash.json when the drop has it. A missing day leaves the signal day.
          # Open positions on that file are net qty from kpi_trades with the snapshot mark.
          # USD and USDC holdings are Robinhood cash: REST when RH keys are set, otherwise data/rh_cash.json.
          # Unset RH keys skip REST and do not fail this step. Live balances are not hardcoded here.
          # The card sizes the day kill and the day target from that cash plus open marks, not from signal_book_usd.
          # Each open row's running P&L is that ticker's close pnl_trade_usd plus the same mark.
          git add -- data/live_book.json data/kpi_summary.json data/kpi_trades_scrubbed.json data/open_positions.json data/sleeve_curves.json data/models_oos.json data/model_scorecard.json data/meta.json
          if [ -f data/rh_kpi_sync_cursor.json ]; then
            git add -- data/rh_kpi_sync_cursor.json
          fi
          if [ -f data/runs.json ]; then
            git add -- data/runs.json
          fi
          if [ -f data/runs.csv ]; then
            git add -- data/runs.csv
          fi
          # A queued run checked out an older main. Rebase onto the newest main before pushing.
          scripts/push_with_retry.sh "Export scrubbed KPI views to data JSON"

      - name: Publish export failure on the board
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/meta.json
          scripts/push_with_retry.sh "Mark KPI export stale"
